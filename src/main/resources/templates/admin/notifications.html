<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Notifications</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="h3 mb-1 fw-bold">Notifications envoyées</h1>
    <p class="text-muted mb-4">Les 200 derniers SMS et emails. « Simulé » = aucun fournisseur configuré (mode développement).</p>
    <div class="card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Agent</th>
                    <th>Canal</th>
                    <th>Message</th>
                    <th>Statut</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(notifications)}">
                    <td colspan="5" class="text-center text-muted py-4">Aucune notification pour l'instant.</td>
                </tr>
                <tr th:each="n : ${notifications}">
                    <td class="text-nowrap small" th:text="${#temporals.format(n.envoyeLe, 'dd/MM HH:mm')}"></td>
                    <td>
                        <div th:text="${n.agent != null ? n.agent.nomComplet : '–'}"></div>
                        <div class="small text-muted" th:text="${n.destinataire}"></div>
                    </td>
                    <td><i class="bi" th:classappend="${n.canal.name() == 'SMS'} ? 'bi-chat-text' : 'bi-envelope'"></i>
                        <span th:text="${n.canal}"></span></td>
                    <td class="small" style="white-space: pre-line; max-width: 32rem;" th:text="${n.message}"></td>
                    <td>
                        <span class="badge" th:classappend="'text-bg-' + ${n.statut.couleur}" th:text="${n.statut.libelle}"></span>
                        <div th:if="${n.erreur}" class="small text-danger" th:text="${n.erreur}"></div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
