<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="${site.id == null ? 'Nouveau lieu' : site.nom}">Lieu</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-7">
            <a th:href="@{/admin/sites}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Lieux</a>
            <h1 class="h3 fw-bold mt-2 mb-4" th:text="${site.id == null ? 'Nouveau lieu de mission' : 'Modifier le lieu'}">Lieu</h1>

            <form th:action="@{/admin/sites/enregistrer}" th:object="${site}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="card mb-3">
                    <div class="card-body row g-3">
                        <div class="col-md-7">
                            <label class="form-label" for="nom">Nom du lieu / magasin</label>
                            <input class="form-control" th:field="*{nom}" th:errorclass="is-invalid" placeholder="Carrefour Market Bellecour" required>
                            <div class="invalid-feedback" th:errors="*{nom}"></div>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label" for="client">Client / enseigne</label>
                            <input class="form-control" th:field="*{client}">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="adresse">Adresse</label>
                            <input class="form-control" th:field="*{adresse}" th:errorclass="is-invalid" required>
                            <div class="invalid-feedback" th:errors="*{adresse}"></div>
                        </div>
                        <div class="col-4">
                            <label class="form-label" for="codePostal">Code postal</label>
                            <input class="form-control" th:field="*{codePostal}" inputmode="numeric">
                        </div>
                        <div class="col-8">
                            <label class="form-label" for="ville">Ville</label>
                            <input class="form-control" th:field="*{ville}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="contactNom">Contact sur place</label>
                            <input class="form-control" th:field="*{contactNom}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="contactTelephone">Téléphone du contact</label>
                            <input type="tel" class="form-control" th:field="*{contactTelephone}">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="consignes">Consignes de poste</label>
                            <textarea class="form-control" rows="4" th:field="*{consignes}"
                                      placeholder="Rondes, accès, codes, numéros d'urgence..."></textarea>
                            <div class="form-text">Visibles par l'agent dans son planning et dans son agenda.</div>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{actif}">
                                <label class="form-check-label" th:for="${#ids.prev('actif')}">Lieu actif</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 justify-content-between">
                    <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
                    <button th:if="${site.id != null}" type="submit" form="form-suppression" class="btn btn-outline-danger">
                        <i class="bi bi-trash me-1"></i>Supprimer</button>
                </div>
            </form>
            <form th:if="${site.id != null}" id="form-suppression" method="post"
                  th:action="@{/admin/sites/{id}/supprimer(id=${site.id})}"
                  onsubmit="return confirm('Supprimer ce lieu ? S\'il a des missions, il sera seulement désactivé.')"></form>
        </div>
    </div>
</div>
</body>
</html>
