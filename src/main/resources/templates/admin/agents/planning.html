<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title th:text="${agent.nomComplet}">Agent</title>
</head>
<body>
<div layout:fragment="content">

    <a th:href="@{/admin/agents}" class="text-decoration-none small no-print"><i class="bi bi-arrow-left"></i> Agents</a>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mt-2 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">
                <span class="pastille" th:style="'background:' + ${agent.couleur}"></span>
                <span th:text="${agent.nomComplet}"></span>
                <span th:if="${!agent.actif}" class="badge text-bg-secondary fs-6 align-middle">Inactif</span>
            </h1>
            <div class="text-muted">
                <a th:href="${@fmt.telLien(agent.telephone)}" class="text-decoration-none me-3">
                    <i class="bi bi-telephone"></i> <span th:text="${agent.telephoneFormate}"></span></a>
                <span th:if="${agent.email}" class="me-3"><i class="bi bi-envelope"></i> <span th:text="${agent.email}"></span></span>
                <span th:if="${agent.carteProNumero}"><i class="bi bi-person-badge"></i>
                    <span th:text="${agent.carteProNumero}"></span>
                    <span th:if="${agent.carteProExpiration}" th:text="'(exp. ' + ${#temporals.format(agent.carteProExpiration, 'dd/MM/yyyy')} + ')'"></span>
                </span>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 no-print">
            <a th:href="@{/admin/missions/nouvelle(agentId=${agent.id})}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Mission</a>
            <a th:href="@{/admin/absences/nouvelle(agentId=${agent.id})}" class="btn btn-outline-primary"><i class="bi bi-calendar-x"></i> Absence</a>
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" type="button">
                    <i class="bi bi-send"></i> Envoyer le planning</button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li th:each="p : ${ {'semaine','semaine-suivante','mois','mois-suivant'} }">
                        <form th:action="@{/admin/agents/{id}/envoyer-planning(id=${agent.id})}" method="post">
                            <input type="hidden" name="periode" th:value="${p}">
                            <button class="dropdown-item" type="submit"
                                    th:text="${p == 'semaine' ? 'Cette semaine' : (p == 'semaine-suivante' ? 'Semaine prochaine' : (p == 'mois' ? 'Ce mois-ci' : 'Mois prochain'))}"></button>
                        </form>
                    </li>
                </ul>
            </div>
            <a th:href="@{/admin/agents/{id}/planning.ics(id=${agent.id})}" class="btn btn-outline-secondary" title="Exporter vers un agenda">
                <i class="bi bi-calendar-plus"></i> .ics</a>
            <a th:href="@{/admin(agentId=${agent.id})}" class="btn btn-outline-secondary" title="Voir dans le calendrier">
                <i class="bi bi-calendar3"></i></a>
            <button type="button" class="btn btn-outline-secondary" onclick="window.print()" title="Imprimer"><i class="bi bi-printer"></i></button>
            <a th:href="@{/admin/agents/{id}/modifier(id=${agent.id})}" class="btn btn-outline-secondary" title="Modifier la fiche">
                <i class="bi bi-pencil"></i></a>
        </div>
    </div>

    <!-- Navigation mois -->
    <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/admin/agents/{id}(id=${agent.id},mois=${moisPrecedent})}" class="btn btn-sm btn-outline-secondary no-print"><i class="bi bi-chevron-left"></i></a>
        <h2 class="h5 mb-0 fw-semibold" th:text="${@fmt.mois(mois)}"></h2>
        <a th:href="@{/admin/agents/{id}(id=${agent.id},mois=${moisSuivant})}" class="btn btn-sm btn-outline-secondary no-print"><i class="bi bi-chevron-right"></i></a>
    </div>

    <!-- Récap du mois -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><div class="card stat-card h-100"><div class="card-body">
            <div class="stat-label">Heures effectuées</div>
            <div class="stat-value" th:text="${recap.heuresEffectuees}"></div>
            <div class="small text-muted" th:text="${recap.joursTravailles()} + ' jour(s) travaillé(s)'"></div>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card stat-card h-100"><div class="card-body">
            <div class="stat-label">Encore planifiées</div>
            <div class="stat-value" th:text="${recap.heuresPlanifiees}"></div>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card stat-card h-100"><div class="card-body">
            <div class="stat-label">Nuit · Dimanche · Férié</div>
            <div class="stat-value fs-5 mt-2" th:text="${recap.heuresNuit + ' · ' + recap.heuresDimanche + ' · ' + recap.heuresFerie}"></div>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card stat-card h-100" th:classappend="${recap.joursAbsence() > 0} ? 'stat-alerte'"><div class="card-body">
            <div class="stat-label">Jours d'absence</div>
            <div class="stat-value" th:text="${recap.joursAbsence()}"></div>
            <div class="small text-muted" th:text="${recap.detailAbsences}"></div>
        </div></div></div>
    </div>

    <!-- Missions du mois -->
    <div class="card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Lieu</th>
                    <th>Horaires</th>
                    <th>Durée</th>
                    <th>Statut</th>
                    <th class="text-end no-print"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#maps.isEmpty(parJour)}">
                    <td colspan="6" class="text-center text-muted py-4">Aucune mission ce mois-ci.</td>
                </tr>
                <th:block th:each="jour : ${parJour}">
                    <tr th:each="m, it : ${jour.value}" th:classappend="${jour.key == aujourdhui} ? 'table-primary'">
                        <td class="text-nowrap fw-semibold" th:text="${it.first} ? ${@fmt.jourCourt(jour.key)} : ''"></td>
                        <td>
                            <div th:text="${m.site.nom}"></div>
                            <div class="small text-muted" th:text="${m.site.adresseComplete}"></div>
                        </td>
                        <td class="text-nowrap" th:text="${m.horairesLibelle}"></td>
                        <td th:text="${@fmt.heures(m.dureeMinutes)}"></td>
                        <td><span class="badge" th:classappend="'text-bg-' + ${m.statut.couleur}" th:text="${m.statut.libelle}"></span></td>
                        <td class="text-end no-print">
                            <a th:href="@{/admin/missions/{id}(id=${m.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card mt-4" th:if="${!#lists.isEmpty(absences)}">
        <div class="card-header bg-transparent fw-semibold">Absences du mois</div>
        <ul class="list-group list-group-flush">
            <li th:each="a : ${absences}" class="list-group-item d-flex justify-content-between">
                <span th:text="${'Du ' + #temporals.format(a.dateDebut, 'dd/MM') + ' au ' + #temporals.format(a.dateFin, 'dd/MM') + (a.motif != null ? ' — ' + a.motif : '')}"></span>
                <span class="badge text-bg-light" th:text="${a.type.libelle}"></span>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
