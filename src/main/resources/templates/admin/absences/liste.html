<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Absences</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="h3 mb-0 fw-bold">Absences</h1>
        <a th:href="@{/admin/absences/nouvelle}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Déclarer une absence</a>
    </div>

    <div th:if="${missionsAReaffecter != null}" class="mb-3 d-flex flex-wrap gap-2">
        <a th:each="id : ${missionsAReaffecter}" th:href="@{/admin/missions/{id}(id=${id})}" class="btn btn-sm btn-warning">
            <i class="bi bi-arrow-left-right"></i> Réaffecter la mission n°<span th:text="${id}"></span></a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Agent</th>
                    <th>Période</th>
                    <th>Jours</th>
                    <th>Type</th>
                    <th class="d-none d-md-table-cell">Motif</th>
                    <th class="text-end"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(absences)}">
                    <td colspan="6" class="text-center text-muted py-4">Aucune absence sur la période.</td>
                </tr>
                <tr th:each="a : ${absences}" th:classappend="${a.dateFin.isBefore(aujourdhui)} ? 'text-muted'">
                    <td>
                        <a th:href="@{/admin/agents/{id}(id=${a.agent.id})}" class="text-decoration-none fw-semibold" th:text="${a.agent.nomComplet}"></a>
                        <div class="small text-muted" th:text="${a.agent.telephoneFormate}"></div>
                    </td>
                    <td class="text-nowrap" th:text="${'Du ' + #temporals.format(a.dateDebut, 'dd/MM/yyyy') + ' au ' + #temporals.format(a.dateFin, 'dd/MM/yyyy')}"></td>
                    <td th:text="${a.nombreJours}"></td>
                    <td><span class="badge text-bg-light" th:text="${a.type.libelle}"></span></td>
                    <td class="d-none d-md-table-cell" th:text="${a.motif ?: ''}"></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/admin/absences/{id}(id=${a.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/admin/absences/{id}/supprimer(id=${a.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Supprimer cette absence ?')">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
