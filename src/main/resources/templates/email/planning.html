<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Votre planning</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fb;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
                <tr>
                    <td style="background:#1e293b;color:#ffffff;padding:20px 24px;font-size:18px;font-weight:bold;" th:text="${appNom}">PlanSécu</td>
                </tr>
                <tr>
                    <td style="padding:24px;">
                        <p style="margin:0 0 8px;font-size:16px;">Bonjour <strong th:text="${agent.prenom}"></strong>,</p>
                        <p style="margin:0 0 20px;">
                            Voici votre planning <span th:text="${periode}"></span>,
                            du <strong th:text="${#temporals.format(debut, 'dd/MM/yyyy')}"></strong>
                            au <strong th:text="${#temporals.format(fin, 'dd/MM/yyyy')}"></strong>
                            — total <strong th:text="${total}"></strong>.
                        </p>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:14px;">
                            <tr style="background:#f1f5f9;">
                                <th align="left" style="padding:8px;">Date</th>
                                <th align="left" style="padding:8px;">Lieu</th>
                                <th align="left" style="padding:8px;">Horaires</th>
                            </tr>
                            <tr th:each="m : ${missions}" th:style="${m.statut.name() == 'ANNULEE'} ? 'color:#94a3b8;text-decoration:line-through;' : ''">
                                <td style="padding:8px;border-bottom:1px solid #e5e7eb;white-space:nowrap;"
                                    th:text="${#temporals.format(m.dateMission, 'EEE dd/MM')}"></td>
                                <td style="padding:8px;border-bottom:1px solid #e5e7eb;">
                                    <strong th:text="${m.site.nom}"></strong><br>
                                    <span style="color:#64748b;font-size:12px;" th:text="${m.site.adresseComplete}"></span>
                                    <div th:if="${m.commentaire}" style="font-size:12px;margin-top:4px;" th:text="${m.commentaire}"></div>
                                </td>
                                <td style="padding:8px;border-bottom:1px solid #e5e7eb;white-space:nowrap;" th:text="${m.horairesLibelle}"></td>
                            </tr>
                        </table>
                        <p style="margin:24px 0 8px;">
                            <a th:href="${baseUrl + '/agent'}" style="background:#2563eb;color:#ffffff;padding:10px 18px;border-radius:8px;text-decoration:none;display:inline-block;">Voir mon planning</a>
                        </p>
                        <p style="margin:16px 0 0;font-size:12px;color:#64748b;">
                            Astuce : ajoutez ce lien à votre agenda pour recevoir les mises à jour automatiquement :<br>
                            <span th:text="${lienIcs}"></span>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
