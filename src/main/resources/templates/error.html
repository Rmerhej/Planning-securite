<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erreur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/zephyr/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <h1 class="display-5 fw-bold" th:text="${status != null ? status : 'Oups'}">Erreur</h1>
    <p class="lead text-muted" th:text="${message != null and !#strings.isEmpty(message) ? message : 'Une erreur est survenue.'}"></p>
    <a th:href="@{/}" class="btn btn-primary">Retour à l'accueil</a>
</div>
</body>
</html>
