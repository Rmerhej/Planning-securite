<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE" th:text="${appNom}">PlanSécu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/zephyr/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <th:block layout:fragment="head"></th:block>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top shadow-sm">
    <div class="container-fluid px-lg-4">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark"><i class="bi bi-shield-check"></i></span>
            <span th:text="${appNom}">PlanSécu</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
                aria-controls="nav" aria-expanded="false" aria-label="Menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('ADMIN')">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}"
                       th:classappend="${uri == '/admin' or #strings.startsWith(uri, '/admin/missions')} ? 'active'">
                        <i class="bi bi-calendar3 me-1"></i>Planning</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/agents}"
                       th:classappend="${#strings.startsWith(uri, '/admin/agents')} ? 'active'">
                        <i class="bi bi-people me-1"></i>Agents</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/sites}"
                       th:classappend="${#strings.startsWith(uri, '/admin/sites')} ? 'active'">
                        <i class="bi bi-shop me-1"></i>Lieux</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/absences}"
                       th:classappend="${#strings.startsWith(uri, '/admin/absences')} ? 'active'">
                        <i class="bi bi-calendar-x me-1"></i>Absences</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/pointages}"
                       th:classappend="${#strings.startsWith(uri, '/admin/pointages')} ? 'active'">
                        <i class="bi bi-qr-code-scan me-1"></i>Pointages</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/recap}"
                       th:classappend="${#strings.startsWith(uri, '/admin/recap')} ? 'active'">
                        <i class="bi bi-clipboard-data me-1"></i>Récap mensuel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/notifications}"
                       th:classappend="${#strings.startsWith(uri, '/admin/notifications')} ? 'active'">
                        <i class="bi bi-bell me-1"></i>Notifications</a>
                </li>
            </ul>
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('AGENT')">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/agent}"><i class="bi bi-calendar-week me-1"></i>Mon planning</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <a class="nav-link text-white-50 small" th:href="@{/compte}" title="Mon compte"
                   th:classappend="${#strings.startsWith(uri, '/compte')} ? 'text-white'">
                    <i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span></a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-sm btn-outline-light" type="submit"><i class="bi bi-box-arrow-right"></i> Déconnexion</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:if="${demo}" class="bandeau-demo text-center small py-2 px-3">
    <i class="bi bi-eye me-1"></i><strong>Version de démonstration</strong> — données fictives, remises à zéro chaque nuit.
    Aucun SMS ni email n'est envoyé.
</div>

<main class="container-fluid px-lg-4 py-4">
    <div th:if="${succes}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${succes}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div th:if="${avertissements != null and !#lists.isEmpty(avertissements)}" class="alert alert-warning" role="alert">
        <div class="fw-semibold mb-1"><i class="bi bi-exclamation-triangle me-1"></i>À vérifier</div>
        <ul class="mb-0 ps-3">
            <li th:each="a : ${avertissements}" th:text="${a}"></li>
        </ul>
    </div>
    <div th:if="${erreur}" class="alert alert-danger" role="alert" th:text="${erreur}"></div>

    <div layout:fragment="content"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
