<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Connexion · ' + ${appNom}">Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/zephyr/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="login-page">
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-sm-9 col-md-6 col-lg-4">
            <div class="text-center mb-4">
                <span class="brand-mark brand-mark-lg"><i class="bi bi-shield-check"></i></span>
                <h1 class="h3 mt-3 mb-1 fw-bold" th:text="${appNom}">PlanSécu</h1>
                <p class="text-muted">Planning des agents de sécurité</p>
            </div>
            <div th:if="${demo}" class="alert alert-warning small">
                <div class="fw-semibold mb-1"><i class="bi bi-eye me-1"></i>Démo : données fictives, aucun SMS ni email envoyé</div>
                <div>Administrateur : <code th:text="${demoConf.adminUser}"></code> / <code th:text="${demoConf.adminPassword}"></code></div>
                <div>Agent : <code th:text="${demoConf.agentUser}"></code> / <code th:text="${demoConf.agentPassword}"></code></div>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div th:if="${param.error}" class="alert alert-danger py-2">Identifiant ou mot de passe incorrect.</div>
                    <div th:if="${param.deconnecte}" class="alert alert-info py-2">Vous êtes déconnecté.</div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Identifiant</label>
                            <input type="text" id="username" name="username" class="form-control form-control-lg"
                                   autocomplete="username" autocapitalize="none" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mot de passe</label>
                            <input type="password" id="password" name="password" class="form-control form-control-lg"
                                   autocomplete="current-password" required>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                            <label class="form-check-label" for="remember-me">Rester connecté</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">Se connecter</button>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a th:href="@{/}" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> Découvrir PlanSécu</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
