# Profil "dev" : base H2 en mémoire (mode MySQL), pour essayer l'appli sans installer MySQL.
# Lancement : mvn spring-boot:run -Dspring-boot.run.profiles=dev,demo
spring:
  datasource:
    url: jdbc:h2:mem:plansecu;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  thymeleaf:
    cache: false
