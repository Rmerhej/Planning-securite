# PlanSécu derrière nginx (installé directement sur le serveur).
# 1. Remplacer planning.ton-domaine.fr par ton sous-domaine (2 endroits)
# 2. sudo cp deploy/nginx-plansecu.conf /etc/nginx/sites-available/plansecu
#    sudo ln -s /etc/nginx/sites-available/plansecu /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. HTTPS : sudo certbot --nginx -d planning.ton-domaine.fr
server {
    listen 80;
    server_name planning.ton-domaine.fr;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
